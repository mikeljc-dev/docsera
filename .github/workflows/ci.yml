name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lee el repo (checkout) y no escribe en ningun sitio: least privilege.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Postgres con pgvector para los tests de integracion (*.integration.test.ts):
    # sin el, ninguna consulta SQL real se comprueba nunca. Los tests se saltan
    # solos si TEST_DATABASE_URL no esta definida, asi que en local siguen
    # funcionando sin base de datos; aqui esta siempre.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docsera
          POSTGRES_PASSWORD: docsera
          POSTGRES_DB: docsera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://docsera:docsera@localhost:5432/docsera_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lee la version de pnpm del campo packageManager del package.json raiz
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Contamos "tests N" de la salida de cada paquete para alimentar el
      # badge dinamico: si el job falla, este paso no se ejecuta y el badge
      # no se toca. node:test cambia de reporter segun haya TTY o no: en un
      # terminal normal usa "spec" ("ℹ tests N"), en el runner de Actions
      # (sin TTY) cae a TAP ("# tests N") -- contemplamos los dos formatos.
      - name: Test
        run: |
          set -o pipefail
          pnpm test | tee test-output.log

      - name: Contar tests para el badge
        run: |
          grep -oE '(ℹ|#) tests [0-9]+' test-output.log \
            | awk '{sum += $3} END {print sum}' > test-count.txt
          cat test-count.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-count
          path: test-count.txt

      - run: pnpm build

  # El job `ci` corre en Node 20 (el suelo soportado: package.json pide
  # >=20). Pero produccion usa node:26-alpine (Dockerfile), y a este repo ya
  # le mordio una vez un fallo especifico de version de Node (navigator/jsdom,
  # salia solo en el runner). Este job repite SOLO la suite de tests en la
  # version de prod para cazar esa clase de bug. No toca el badge ni es el
  # check requerido (eso sigue siendo `ci`): typecheck/lint/build ya se cubren
  # alli y no dependen de la version de Node.
  tests-node-prod:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docsera
          POSTGRES_PASSWORD: docsera
          POSTGRES_DB: docsera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://docsera:docsera@localhost:5432/docsera_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # La version de node:26-alpine con la que se construye la imagen de prod.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  update-tests-badge:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Unico job del workflow que escribe: solo para publicar el badge en la
    # rama huerfana `badges` (sin proteccion, no toca `main`).
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: test-count

      - name: Publicar badge en la rama badges
        run: |
          count=$(cat test-count.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges
            git worktree add /tmp/badges-wt origin/badges
            (cd /tmp/badges-wt && git checkout -B badges)
          else
            git worktree add --orphan -b badges /tmp/badges-wt
          fi

          printf '{"schemaVersion":1,"label":"tests","message":"%s passing","color":"brightgreen"}\n' \
            "$count" > /tmp/badges-wt/tests.json

          cd /tmp/badges-wt
          git add tests.json
          if git diff --cached --quiet; then
            echo "Badge sin cambios, no hace falta commit"
          else
            git commit -q -m "chore: actualiza el badge de tests ($count passing)"
            git push origin badges
          fi
